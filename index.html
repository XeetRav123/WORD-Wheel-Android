<style>
:root{
  --bg:#efeaf6; --surface:#ffffff; --text:#241f2d; --dim:#857b96;
  --accent:#6d3fc0; --accent-2:#8a5ae0; --on-accent:#ffffff;
  --line:#ddd3ec; --shadow:0 1px 2px rgba(60,30,110,.12);
  color-scheme: light dark;
}
@media (prefers-color-scheme: dark){
  :root{
    --bg:#0f0d15; --surface:#1d1927; --text:#ece6f5; --dim:#8f84a3;
    --accent:#7b4fd6; --accent-2:#9a73ee; --on-accent:#ffffff;
    --line:#2b2538; --shadow:none;
  }
}
*{box-sizing:border-box; -webkit-tap-highlight-color:transparent}
html,body{height:100%; margin:0; overflow:hidden; overscroll-behavior:none}
html{
  --ui-s: 1;
  --ui-fs: calc(16px * var(--ui-s));
  font-size: var(--ui-fs);
}
body{
  background:var(--bg); color:var(--text);
  font-family: system-ui, -apple-system, "Segoe UI", Roboto, "Noto Sans", sans-serif;
  font-size:var(--ui-fs, 16px); line-height:1.4;
}
.app{
  position:fixed; inset:0; height:100%; max-width:720px; margin:0 auto;
  display:flex; flex-direction:column; background:var(--bg);
}
@supports (height:100dvh){ .app{height:100dvh} }
.top{
  flex:none; display:flex; align-items:center; gap:12px;
  padding:10px 14px; background:var(--surface); border-bottom:1px solid var(--line);
}
.avatar{
  width:42px; height:42px; border-radius:50%; flex:none;
  display:grid; place-items:center; font-size:20px;
  background:linear-gradient(135deg,var(--accent),var(--accent-2)); color:#fff;
}
.who b{display:block; font-size:16px; line-height:1.2}
.who span{display:flex; align-items:center; gap:6px; font-size:13px; color:var(--dim)}
.who span::before{content:""; width:8px; height:8px; border-radius:50%; background:#3fbf7f}
#log{
  flex:1; min-height:0; overflow-y:auto; -webkit-overflow-scrolling:touch;
  padding:14px 12px; display:flex; flex-direction:column; gap:4px;
}
.chip{
  align-self:center; margin:6px 0 10px; padding:4px 12px; border-radius:999px;
  background:var(--surface); color:var(--dim); font-size:12px; text-align:center;
}
.row{display:flex; margin-top:6px}
.row.user{justify-content:flex-end}
.bubble{
  max-width:80%; padding:8px 12px 6px; border-radius:18px;
  box-shadow:var(--shadow); white-space:pre-wrap; overflow-wrap:anywhere;
  font-size:15px;
}
.bot .bubble{background:var(--surface); border-bottom-left-radius:5px}
.user .bubble{
  background:linear-gradient(135deg,var(--accent),var(--accent-2));
  color:var(--on-accent); border-bottom-right-radius:5px;
}
.composer{
  flex:none; display:flex; align-items:flex-end; gap:8px;
  padding:8px 10px; background:var(--surface); border-top:1px solid var(--line);
}
#in{
  flex:1; min-width:0; height:44px; font:inherit; color:var(--text);
  background:var(--bg); border:1px solid var(--line); border-radius:22px; padding:0 16px;
  outline:none; font-size:15px;
}
#send{
  flex:none; width:44px; height:44px; border-radius:50%; border:0; cursor:pointer;
  background:linear-gradient(135deg,var(--accent),var(--accent-2)); color:var(--on-accent);
  display:grid; place-items:center; font-size:18px;
}
</style>
</head>
<body>
<div class="app">
  <div class="top">
    <div class="avatar">W</div>
    <div class="who"><b>WORD Wheel</b><span>online</span></div>
  </div>
  <div id="log">
    <div class="chip">WORD Wheel 1.8.68</div>
    <div class="row bot"><div class="bubble">Приложение запущено. Полный функционал доступен.</div></div>
  </div>
  <div class="composer">
    <input id="in" placeholder="Напиши сообщение..." />
    <button id="send">➤</button>
  </div>
</div>
<script>
const log = document.getElementById('log');
const input = document.getElementById('in');
const send = document.getElementById('send');
function addMessage(text, isUser) {
  const row = document.createElement('div');
  row.className = 'row ' + (isUser ? 'user' : 'bot');
  const bubble = document.createElement('div');
  bubble.className = 'bubble';
  bubble.textContent = text;
  row.appendChild(bubble);
  log.appendChild(row);
  log.scrollTop = log.scrollHeight;
}
send.onclick = () => {
  const text = input.value.trim();
  if (!text) return;
  addMessage(text, true);
  input.value = '';
  setTimeout(() => addMessage('Получено: ' + text, false), 500);
};
input.onkeydown = (e) => { if (e.key === 'Enter') send.click(); };
</script>
</body>
