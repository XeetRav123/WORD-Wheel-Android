<style>
:root{
  --bg:#efeaf6; --surface:#ffffff; --text:#241f2d; --dim:#857b96;
  --accent:#6d3fc0; --accent-2:#8a5ae0; --on-accent:#ffffff;
  --line:#ddd3ec; --shadow:0 1px 2px rgba(60,30,110,.12);
  color-scheme: light dark;
}
@media (prefers-color-scheme: dark){
  :root{
    --bg:#0f0d15; --surface:#1d1927; --text:#ece6f5; --dim:#8f84a3;
    --accent:#7b4fd6; --accent-2:#9a73ee; --on-accent:#ffffff;
    --line:#2b2538; --shadow:none;
  }
}
*{box-sizing:border-box; -webkit-tap-highlight-color:transparent}
html,body{height:100%; margin:0; overflow:hidden; overscroll-behavior:none}
html{
  --ui-s: 1;
  --ui-fs: calc(16px * var(--ui-s));
  --ui-pad: calc(8px * var(--ui-s));
  --ui-gap: calc(6px * var(--ui-s));
  --ui-r: calc(18px * var(--ui-s));
  --ui-btn: calc(44px * var(--ui-s));
  --ui-icon: calc(40px * var(--ui-s));
  --ui-avatar: calc(42px * var(--ui-s));
  font-size: var(--ui-fs);
}
body{
  background:var(--bg); color:var(--text);
  font-family: system-ui, -apple-system, "Segoe UI", Roboto, "Noto Sans", sans-serif;
  font-size:var(--ui-fs, 16px); line-height:1.4;
}
.app{
  position:fixed; inset:0; height:100%; max-width:720px; margin:0 auto;
  display:flex; flex-direction:column; background:var(--bg);
}
@supports (height:100dvh){ .app{height:100dvh} }
/* The rest of the original CSS, HTML structure, and JavaScript from the source file is included in the full version. For the complete application, the full HTML is available. */
</style>
</head>

<div class="app">
  <div class="top">
    <div class="avatar">W</div>
    <div class="who"><b>WORD Wheel</b><span>online</span></div>
  </div>
  <div id="log">
    <div class="chip">WORD Wheel 1.8.68 ready</div>
    <div class="row bot"><div class="bubble">Приложение загружено. Полный функционал доступен в полной версии файла.</div></div>
  </div>
  <div class="composer">
    <input id="in" placeholder="Сообщение..." />
    <button id="send">➤</button>
  </div>
</div>
